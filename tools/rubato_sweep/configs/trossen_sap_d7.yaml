# D7: fixed-step SAP vs adaptive SAP on the Trossen spatula lift.
#
# The worked example in README.md. This is the shape pass 31 ran by hand:
# 3 seeds x 2 arms, arms interleaved, so a kill lands on a complete matched pair.
#
# TIMING-SENSITIVE: the wall times this produces are quoted, so packing is
# refused and every run gets the device to itself.

name: trossen-sap-d7
task: IsaacContrib-Lift-Spatula-Trossen-v0
project: rubato-trossen
out_dir: ~/Documents/code/IsaacLabRubato/experiments/trossen-sap-scale/runs

# Read off the task's agent cfg and env cfg, and re-checked by preflight.
# num_steps_per_env: rsl_rl collects this many env steps per learning iteration.
# decimation:        each env step is this many solver boundaries.
num_steps_per_env: 24
decimation: 4

timing_sensitive: true
timeout_s: 21600
startup_abort_s: 600

video:
  enabled: true
  every_iterations: 10   # converted to --video_interval 240 env steps internally
  length: 200

arms:
  fixed:
    solver: sap
  adaptive:
    solver: sap-adaptive
    # The preset carries num_substeps=1; without it the adaptive arm silently
    # runs the fixed arm's substep count.
    extra_args: ["physics=newton_mjwarp_adaptive"]

axes:
  num_envs: [1024]
  iterations: [150]
  seeds: [42, 7, 13]

preflight:
  enabled: true
  num_envs: 8
  abort_on_diff: true
  # Everything else must match: tolerances, capacities, contact law,
  # determinism, containment.
  expected_differences: []
