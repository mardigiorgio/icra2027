# QUEUED, NOT RUN. Written pass 33; no GPU was available that pass.
#
# THE MEASUREMENT: what does packing two runs on one card actually buy?
#
# Concurrency is the only lever that raises portfolio throughput without
# changing the science, but its multiplier is unmeasured. Two runs at 1024 envs
# fit in memory (a 1024-env mug run occupies ~11 GB of 32.6 GB); the open
# question is how much SM and memory-bandwidth contention eats.
#
# PROTOCOL. Run the same total work twice and compare wall:
#   (1) EXCLUSIVE baseline: run p33-pack-baseline (packing off). Record the
#       total wall of the 4 cells from journal.jsonl.
#   (2) PACKED: run this config (packing on, 2 slots). Record the same total.
#   multiplier = wall_exclusive_total / wall_packed_total
# Expect < 2. Anything at or above 2 means the exclusive baseline was
# contaminated -- check the census lines in both journals before believing it.
#
# THE RULE THIS ENCODES. Packed runs are tagged exclusive=false in their JSON
# and the analyzer prints them as timing-unusable. The multiplier measured here
# is a PORTFOLIO planning number; it is never a per-run correction factor to
# apply to a packed wall.

name: p33-pack-probe
task: IsaacContrib-Lift-Spatula-Trossen-v0
project: rubato-trossen
out_dir: ~/Documents/code/icra2027/experiments/trossen-sap-scale/runs-pack

num_steps_per_env: 24
decimation: 4

# Required to enable packing: this sweep's walls are aggregate portfolio
# numbers, not per-run measurements.
timing_sensitive: false
timeout_s: 21600

packing:
  enabled: true
  per_run_gb: 12.0     # measured 1024-env footprint plus margin
  headroom_gb: 4.0     # display, drivers, the fragmentation that OOMs a build
  max_concurrent: 2

video:
  enabled: false       # the recorder is a second contention source

arms:
  fixed:
    solver: sap
  adaptive:
    solver: sap-adaptive
    extra_args: ["physics=newton_mjwarp_adaptive"]

axes:
  num_envs: [1024]
  iterations: [100]
  seeds: [42, 7]

preflight:
  enabled: true
  num_envs: 8
  abort_on_diff: true
  expected_differences: []
